[project]
name = "afterhours-lab"
version = "0.1.0"
description = "Read-only market-data lab application, gateway-only (no Schwab credentials of its own)"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "exchange-calendars>=4.13.2,<5",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    "schwab-gateway-sdk",
    "structlog>=24.0.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
schwab-gateway-sdk = { git = "https://github.com/hollowc2/SchwabGateway.git", rev = "5b8f1d76aa9fb97a300172d39e7afcc4ab60e83a", subdirectory = "packages/sdk" }

[project.scripts]
afterhours-lab-smoke = "afterhours_lab.main:main"
afterhours-lab-watch = "afterhours_lab.watch:main"
afterhours-lab-archive-earnings = "afterhours_lab.archive_earnings:main"
afterhours-lab-backfill-liquidity = "afterhours_lab.backfill_liquidity:main"
afterhours-lab-reconcile-calendar = "afterhours_lab.calendar_reconcile:main"
afterhours-lab-migrate = "afterhours_lab.db.migrate:main"
afterhours-lab-capture = "afterhours_lab.capture:main"
afterhours-lab-collect-history = "afterhours_lab.collect_history:main"
afterhours-lab-capture-ohlcv = "afterhours_lab.capture_ohlcv:main"
afterhours-lab-audit-ohlcv = "afterhours_lab.audit_ohlcv:main"
afterhours-lab-moves = "afterhours_lab.moves:main"
afterhours-lab-reactions = "afterhours_lab.reactions:main"
afterhours-lab-persist-reactions = "afterhours_lab.persist_reactions:main"
afterhours-lab-reprocess-stale-coverage = "afterhours_lab.reprocess_stale_coverage:main"
afterhours-lab-persist-outcomes = "afterhours_lab.persist_outcomes:main"
afterhours-lab-study = "afterhours_lab.study_cli:main"
afterhours-lab-web = "afterhours_lab.web.app:main"
afterhours-lab-monitor = "afterhours_lab.monitor:main"

[project.optional-dependencies]
# DataFrame and Parquet exports are optional: the CLI, capture jobs, and the web
# server never import them, so they stay out of the default install.
research = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
]
# Jupyter for the research notebooks under notebooks/. They are clients of
# afterhours_lab.research, so this pulls the research extra in with it. Not in the
# default install: the CLI, capture jobs, and web server never import a notebook.
notebooks = [
    "afterhours-lab[research]",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afterhours_lab"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env", "/.env.*", "/.git", "/.venv", "/dist"]

[tool.ruff]
target-version = "py312"
line-length = 100
# The notebooks under notebooks/ are research clients, not library code: they keep
# a shared import cell and lean on interactive display, so import-sorting and
# unused-import rules do not apply cleanly to them.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]
