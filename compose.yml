name: afterhours_lab

services:
  afterhours-lab:
    build: .
    image: afterhours-lab:latest
    env_file: .env
    environment:
      # Keep the secret-bearing .env untouched while routing this app to the
      # loopback-only candidate through its existing monitoring_net alias.
      SCHWAB_GATEWAY_URL: http://schwab-gateway-candidate:8012
    volumes:
      - "./data:/app/data"
    networks:
      monitoring_net:
        aliases: [afterhours-lab]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["afterhours-lab-archive-earnings", "--watchlist", "/app/data/watchlist.json"]

networks:
  monitoring_net:
    external: true
